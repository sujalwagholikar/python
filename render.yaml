services:
  - type: web
    name: jarvis-web
    env: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY_JARVIS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_JARVIS
        value: llama-3.3-70b-versatile
      - key: TAVILY_API_KEY
        sync: false
