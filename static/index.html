<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg-void: #050a10;
    --bg-panel: #0a1620;
    --line: #12303f;
    --cyan: #4fd8e8;
    --cyan-dim: #1c5866;
    --amber: #f2a03d;
    --text: #cfe9ee;
    --text-dim: #5f8a93;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-void);
    color: var(--text);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 50% 0%, rgba(79,216,232,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(79,216,232,0.025) 0px, rgba(79,216,232,0.025) 1px, transparent 1px, transparent 3px);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ---------- Header / HUD strip ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10,22,32,0.9), rgba(10,22,32,0.4));
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .core {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }
  .core::before, .core::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--cyan);
    opacity: 0.55;
  }
  .core::after {
    inset: 7px;
    animation: spin 3.5s linear infinite;
    border-style: dashed;
  }
  .core-dot {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 14px 3px var(--cyan);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.65; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .brand-text h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.32em;
    font-weight: 600;
    color: var(--cyan);
  }
  .brand-text span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan-dim);
  }
  .status-dot.online { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .status-dot.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s ease-in-out infinite; }

  /* ---------- Notice bar ---------- */
  .notice {
    font-size: 11px;
    color: var(--text-dim);
    padding: 8px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(242,160,61,0.04);
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .notice b { color: var(--amber); font-weight: 600; }

  /* ---------- Chat area ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 26px 18px 10px;
    display: flex;
    justify-content: center;
  }
  .thread {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 88%;
    animation: rise 0.25s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    letter-spacing: 0.05em;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    margin-top: 2px;
  }
  .msg.user .avatar { border-color: var(--text-dim); color: var(--text-dim); }

  .bubble {
    padding: 11px 15px;
    border-radius: 3px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.jarvis .bubble {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--cyan);
    color: var(--text);
  }
  .msg.user .bubble {
    background: transparent;
    border: 1px solid var(--line);
    border-right: 2px solid var(--text-dim);
    color: #d9e6e9;
  }

  .tag {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cyan-dim);
    margin-bottom: 5px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--cyan);
    opacity: 0.4;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  /* ---------- Composer ---------- */
  .composer-wrap {
    display: flex;
    justify-content: center;
    padding: 14px 18px 20px;
    border-top: 1px solid var(--line);
    background: linear-gradient(0deg, rgba(10,22,32,0.9), rgba(10,22,32,0.3));
    flex-shrink: 0;
  }
  .composer {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 8px 8px 14px;
  }
  .composer:focus-within { border-color: var(--cyan-dim); }

  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 140px;
    padding: 6px 0;
  }
  textarea::placeholder { color: var(--text-dim); }

  button.send {
    background: var(--cyan-dim);
    color: #04141a;
    border: none;
    border-radius: 3px;
    padding: 9px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  button.send:hover:not(:disabled) { background: var(--cyan); }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0.04em;
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  main::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="core"><div class="core-dot"></div></div>
        <div class="brand-text">
          <h1>J.A.R.V.I.S.</h1>
          <span id="subtitle">reasoning core — standing by</span>
        </div>
      </div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">connecting…</span>
      </div>
    </header>

    <div class="notice">
      <b>Cloud session:</b> conversation &amp; web search are live. Phone control (ADB) only runs from the local desktop app on the PC connected to your device.
    </div>

    <main>
      <div class="thread" id="thread"></div>
    </main>

    <div class="composer-wrap">
      <div style="width:100%; max-width:720px;">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Speak to JARVIS…"></textarea>
          <button class="send" id="sendBtn">Send</button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  </div>

<script>
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const subtitle = document.getElementById('subtitle');

  const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

  function addMessage(role, text, tag) {
    const row = document.createElement('div');
    row.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'jarvis' ? 'J' : 'You';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (tag) {
      const tagEl = document.createElement('span');
      tagEl.className = 'tag';
      tagEl.textContent = tag;
      bubble.appendChild(tagEl);
      bubble.appendChild(document.createElement('br'));
    }
    bubble.appendChild(document.createTextNode(text));

    row.appendChild(avatar);
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg jarvis';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="avatar">J</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    thread.appendChild(row);
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function setStatus(state, label) {
    statusDot.className = 'status-dot ' + state;
    statusText.textContent = label;
  }

  async function init() {
    try {
      const res = await fetch('/api/health');
      const data = await res.json();
      if (data.groq_key_configured) {
        setStatus('online', 'online');
        subtitle.textContent = 'reasoning core — online';
      } else {
        setStatus('busy', 'no api key');
        subtitle.textContent = 'GROQ_API_KEY not configured on server';
      }
    } catch (e) {
      setStatus('busy', 'offline');
      subtitle.textContent = 'cannot reach backend';
    }

    try {
      const res = await fetch('/api/greeting');
      const data = await res.json();
      addMessage('jarvis', data.reply || 'At your service, sir.');
    } catch (e) {
      addMessage('jarvis', 'At your service, sir. (Greeting service unavailable.)');
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    setStatus('busy', 'thinking…');
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const data = await res.json();
      removeTyping();
      addMessage('jarvis', data.reply, data.mode === 'search' ? 'web search' : null);
      setStatus('online', 'online');
    } catch (err) {
      removeTyping();
      addMessage('jarvis', "I've lost my connection to the reasoning core, sir. Please try again in a moment.");
      setStatus('busy', 'error');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  init();
</script>
</body>
</html>
